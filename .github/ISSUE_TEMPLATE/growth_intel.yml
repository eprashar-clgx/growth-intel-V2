name: Growth Intel (legacy)
description: Change to the legacy Growth Intelligence V2 indicators
labels: [growth-intel]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Which indicator / table is affected and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Task checklist
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Brief for the session that picks this up, so it doesn't re-read every doc.
        Usually written by the planning session. Keep it short; point to files, don't copy them.
      value: |
        **Read first:** files + line ranges (and what to skip)
        **Tables and joins:** sources, keys, grain
        **Decisions:** already made; names to use (glossary terms)
        **Gotchas:** conflicts with other issues, access limits, open questions
