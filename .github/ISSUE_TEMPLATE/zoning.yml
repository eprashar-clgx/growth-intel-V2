name: Zoning
description: Work on the zoning change indicator POC
labels: [zoning]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem does this solve? Reference rule IDs (R1–R15) or growth-signal steps from zoning/docs/zoning_mvp2.md (MVP1: zoning/docs/zoning_POC_mvp1.md) where relevant.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Task checklist
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria (e.g. counties validated, doc updated)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Brief for the session that picks this up, so it doesn't re-read every doc.
        Usually written by the planning session. Keep it short; point to files, don't copy them.
      value: |
        **Read first:** files + line ranges (and what to skip)
        **Tables and joins:** sources, keys, grain
        **Decisions:** already made; names to use (glossary terms)
        **Gotchas:** conflicts with other issues, access limits, open questions
